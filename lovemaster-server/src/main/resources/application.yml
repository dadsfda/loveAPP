spring:
  application:
    name: lovemaster-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

lovemaster:
  cors:
    allowed-origins: ${LOVEMASTER_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    image-dir: uploads/images
    image-url-prefix: /uploads/images
    max-image-size: 5242880
    storage-type: ${LOVEMASTER_STORAGE_TYPE:local}
    cos:
      secret-id: ${TENCENTCLOUD_SECRET_ID:${TENCENTCLOUD_SECRETID:}}
      secret-key: ${TENCENTCLOUD_SECRET_KEY:${TENCENTCLOUD_SECRETKEY:}}
      region: ${CLOUDBASE_STORAGE_REGION:}
      bucket: ${CLOUDBASE_STORAGE_BUCKET:}
      key-prefix: ${CLOUDBASE_STORAGE_KEY_PREFIX:uploads/images}
      public-base-url: ${CLOUDBASE_STORAGE_PUBLIC_BASE_URL:}
  ai:
    enabled: false
    provider: qwen
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    timeout-seconds: 20
    api-key-env-name: DASHSCOPE_API_KEY

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
